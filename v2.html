<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>成长教育学单词 2.0</title><style>body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f7f4ee,#efe7dc);color:#2f2a24}.wrap{max-width:860px;margin:60px auto;padding:24px}.card{background:#fffdf9;border:1px solid #ddd5c7;border-radius:18px;padding:28px;box-shadow:0 10px 24px rgba(90,80,60,.08)}h1{margin:0 0 8px;font-size:34px}.muted{color:#6b6257}.bank-section{background:#f5f1eb;border-radius:12px;padding:20px;margin-bottom:24px;border:1px solid #e5ddd3}.bank-section h2{margin:0 0 16px;font-size:18px;color:#5a5247;display:flex;align-items:center;gap:8px}.bank-cats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.cat-btn{padding:8px 16px;border-radius:999px;border:1px solid #d8d0c4;background:#fff;cursor:pointer;font-size:14px;transition:all .2s}.cat-btn:hover{background:#f5f1eb}.cat-btn.active{background:#7b6ed6;color:#fff;border-color:#6f63c9}.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:280px;overflow-y:auto;padding:4px}.bank-option{padding:12px;border:2px solid #d8d0c4;border-radius:10px;background:#fff;cursor:pointer;text-align:center;font-size:14px;transition:all .2s}.bank-option:hover{border-color:#a8a090}.bank-option.selected{border-color:#7b6ed6;background:#f0edff;color:#5a4abf}.bank-option .name{font-weight:600;margin-bottom:3px;font-size:14px}.bank-option .count{font-size:12px;color:#888}.bank-actions{display:flex;gap:12px;margin-top:16px;justify-content:flex-end}.btn-small{padding:10px 20px;border-radius:8px;border:1px solid #d8d0c4;background:#fff;cursor:pointer;font-size:14px;transition:all .2s}.btn-small:hover{background:#f5f1eb}.btn-small.primary{background:#7b6ed6;color:#fff;border-color:#7b6ed6}.btn-small.primary:hover{background:#6b5ec6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.btn{display:block;text-decoration:none;background:#7b6ed6;color:#fff;padding:22px;border-radius:16px;font-size:24px;font-weight:700;text-align:center;cursor:pointer;border:none;width:100%}.btn.alt{background:#4a8f72}.sub{margin-top:10px;font-size:15px;color:#6b6257;text-align:center}.cur-bank{margin:12px 0;padding:12px;background:#fff;border-radius:8px;border-left:4px solid #7b6ed6}.cur-bank .label{font-size:12px;color:#888;margin-bottom:4px}.cur-bank .name{font-size:16px;font-weight:600;color:#2f2a24}</style></head><body><div class="wrap"><div class="card"><h1>📘 成长教育学单词 2.0</h1><div class="muted">当前 1.0 保留不动，这里先开始拆成学习区 / 检测区双页结构。</div><div class="bank-section"><h2>🎯 选择题库</h2><div class="bank-cats"><button class="cat-btn" data-cat="primary">小学外研版</button><button class="cat-btn" data-cat="g7">七年级</button><button class="cat-btn" data-cat="g8">八年级</button><button class="cat-btn" data-cat="g9">九年级</button><button class="cat-btn" data-cat="exam">考级</button><button class="cat-btn active" data-cat="all">全部</button></div><div class="bank-grid" id="bankGrid"></div><div class="cur-bank" id="curBank" style="display:none"><div class="label">当前选择</div><div class="name" id="curBankName">-</div></div><div class="bank-actions"><button class="btn-small primary" onclick="confirmBank()">✓ 确认选择</button></div></div><div class="grid"><div><a class="btn" href="./v2-study.html" onclick="return checkBankSelected()">进入学习区</a><div class="sub">设置 + 生字学习</div></div><div><a class="btn alt" href="./v2-test.html" onclick="return checkBankSelected()">进入检测区</a><div class="sub">闯关 + 成绩</div></div></div></div></div><script>const BANK_DATA={primary:[{id:"g1s",name:"一年级上",cat:"primary",count:"60词"},{id:"g1x",name:"一年级下",cat:"primary",count:"60词"},{id:"g2s",name:"二年级上",cat:"primary",count:"60词"},{id:"g2x",name:"二年级下",cat:"primary",count:"60词"},{id:"g3s",name:"三年级上",cat:"primary",count:"60词"},{id:"g3x",name:"三年级下",cat:"primary",count:"60词"},{id:"g4s",name:"四年级上",cat:"primary",count:"70词"},{id:"g4x",name:"四年级下",cat:"primary",count:"70词"},{id:"g5s",name:"五年级上",cat:"primary",count:"70词"},{id:"g5x",name:"五年级下",cat:"primary",count:"70词"},{id:"g6s",name:"六年级上",cat:"primary",count:"70词"},{id:"g6x",name:"六年级下",cat:"primary",count:"70词"}],g7:[{id:"g7starter1",name:"七年级 Starter 1",cat:"g7",count:"17词"},{id:"g7starter2",name:"七年级 Starter 2",cat:"g7",count:"6词"},{id:"g7starter3",name:"七年级 Starter 3",cat:"g7",count:"9词"},{id:"g7u1",name:"七年级 Unit 1",cat:"g7",count:"30词"},{id:"g7u2",name:"七年级 Unit 2",cat:"g7",count:"30词"},{id:"g7u3",name:"七年级 Unit 3",cat:"g7",count:"40词"},{id:"g7u4",name:"七年级 Unit 4",cat:"g7",count:"35词"},{id:"g7u5",name:"七年级 Unit 5",cat:"g7",count:"40词"},{id:"g7u6",name:"七年级 Unit 6",cat:"g7",count:"40词"},{id:"g7u7",name:"七年级 Unit 7",cat:"g7",count:"40词"},{id:"g7u8",name:"七年级 Unit 8",cat:"g7",count:"40词"},{id:"g7u9",name:"七年级 Unit 9",cat:"g7",count:"40词"},{id:"g7u10",name:"七年级 Unit 10",cat:"g7",count:"40词"},{id:"g7u11",name:"七年级 Unit 11",cat:"g7",count:"40词"},{id:"g7u12",name:"七年级 Unit 12",cat:"g7",count:"40词"}],g8:[{id:"g8s-u1",name:"八年级上 Unit 1",cat:"g8",count:"50词"},{id:"g8s-u2",name:"八年级上 Unit 2",cat:"g8",count:"50词"},{id:"g8s-u3",name:"八年级上 Unit 3",cat:"g8",count:"50词"},{id:"g8s-u4",name:"八年级上 Unit 4",cat:"g8",count:"50词"},{id:"g8s-u5",name:"八年级上 Unit 5",cat:"g8",count:"50词"},{id:"g8s-u6",name:"八年级上 Unit 6",cat:"g8",count:"50词"},{id:"g8s-u7",name:"八年级上 Unit 7",cat:"g8",count:"50词"},{id:"g8s-u8",name:"八年级上 Unit 8",cat:"g8",count:"50词"},{id:"g8s-u9",name:"八年级上 Unit 9",cat:"g8",count:"50词"},{id:"g8s-u10",name:"八年级上 Unit 10",cat:"g8",count:"50词"},{id:"g8x-u1",name:"八年级下 Unit 1",cat:"g8",count:"50词"},{id:"g8x-u2",name:"八年级下 Unit 2",cat:"g8",count:"50词"},{id:"g8x-u3",name:"八年级下 Unit 3",cat:"g8",count:"50词"},{id:"g8x-u4",name:"八年级下 Unit 4",cat:"g8",count:"50词"},{id:"g8x-u5",name:"八年级下 Unit 5",cat:"g8",count:"50词"},{id:"g8x-u6",name:"八年级下 Unit 6",cat:"g8",count:"50词"},{id:"g8x-u7",name:"八年级下 Unit 7",cat:"g8",count:"50词"},{id:"g8x-u8",name:"八年级下 Unit 8",cat:"g8",count:"50词"},{id:"g8x-u9",name:"八年级下 Unit 9",cat:"g8",count:"50词"},{id:"g8x-u10",name:"八年级下 Unit 10",cat:"g8",count:"50词"}],g9:[{id:"g9s-u1",name:"九年级上 Unit 1",cat:"g9",count:"50词"},{id:"g9s-u2",name:"九年级上 Unit 2",cat:"g9",count:"50词"},{id:"g9s-u3",name:"九年级上 Unit 3",cat:"g9",count:"50词"},{id:"g9s-u4",name:"九年级上 Unit 4",cat:"g9",count:"50词"},{id:"g9s-u5",name:"九年级上 Unit 5",cat:"g9",count:"50词"},{id:"g9s-u6",name:"九年级上 Unit 6",cat:"g9",count:"50词"},{id:"g9s-u7",name:"九年级上 Unit 7",cat:"g9",count:"50词"},{id:"g9s-u8",name:"九年级上 Unit 8",cat:"g9",count:"50词"},{id:"g9s-u9",name:"九年级上 Unit 9",cat:"g9",count:"50词"},{id:"g9s-u10",name:"九年级上 Unit 10",cat:"g9",count:"50词"},{id:"g9s-u11",name:"九年级上 Unit 11",cat:"g9",count:"50词"},{id:"g9s-u12",name:"九年级上 Unit 12",cat:"g9",count:"50词"},{id:"g9s-u13",name:"九年级上 Unit 13",cat:"g9",count:"50词"},{id:"g9s-u14",name:"九年级上 Unit 14",cat:"g9",count:"50词"},{id:"g9x-u1",name:"九年级下 Unit 1",cat:"g9",count:"50词"},{id:"g9x-u2",name:"九年级下 Unit 2",cat:"g9",count:"50词"},{id:"g9x-u3",name:"九年级下 Unit 3",cat:"g9",count:"50词"},{id:"g9x-u4",name:"九年级下 Unit 4",cat:"g9",count:"50词"},{id:"g9x-u5",name:"九年级下 Unit 5",cat:"g9",count:"50词"},{id:"g9x-u6",name:"九年级下 Unit 6",cat:"g9",count:"50词"},{id:"g9x-u7",name:"九年级下 Unit 7",cat:"g9",count:"50词"},{id:"g9x-u8",name:"九年级下 Unit 8",cat:"g9",count:"50词"},{id:"g9x-u9",name:"九年级下 Unit 9",cat:"g9",count:"50词"},{id:"g9x-u10",name:"九年级下 Unit 10",cat:"g9",count:"50词"}],exam:[{id:"ket",name:"KET核心词",cat:"exam",count:"500词"},{id:"pet",name:"PET核心词",cat:"exam",count:"800词"}]};let selectedBank=null,currentCat='all';function renderBanks(){const grid=document.getElementById('bankGrid');grid.innerHTML='';const allBanks=[...BANK_DATA.primary,...BANK_DATA.g7,...BANK_DATA.g8,...BANK_DATA.g9,...BANK_DATA.exam];const banks=currentCat==='all'?allBanks:allBanks.filter(b=>b.cat===currentCat);banks.forEach(bank=>{const div=document.createElement('div');div.className='bank-option';if(selectedBank===bank.id)div.classList.add('selected');div.dataset.id=bank.id;div.innerHTML=`<div class="name">${bank.name}</div><div class="count">${bank.count}</div>`;div.onclick=()=>selectBank(bank.id);grid.appendChild(div)})}function selectBank(id){selectedBank=id;document.querySelectorAll('.bank-option').forEach(o=>o.classList.remove('selected'));document.querySelector(`.bank-option[data-id="${id}"]`).classList.add('selected');const allBanks=[...BANK_DATA.primary,...BANK_DATA.g7,...BANK_DATA.g8,...BANK_DATA.g9,...BANK_DATA.exam];const bank=allBanks.find(b=>b.id===id);document.getElementById('curBank').style.display='block';document.getElementById('curBankName').textContent=bank?bank.name+' ('+bank.count+')':'-';localStorage.setItem('vocab-bank',id)}function confirmBank(){if(!selectedBank){alert('请先选择一个题库');return}const allBanks=[...BANK_DATA.primary,...BANK_DATA.g7,...BANK_DATA.g8,...BANK_DATA.g9,...BANK_DATA.exam];const bank=allBanks.find(b=>b.id===selectedBank);alert('已确认选择：'+bank.name+' ('+bank.count+')')}function checkBankSelected(){const saved=localStorage.getItem('vocab-bank');if(!saved&&!selectedBank){alert('请先选择题库');return false}return true}document.querySelectorAll('.cat-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;renderBanks()})});renderBanks();const savedBank=localStorage.getItem('vocab-bank');if(savedBank){selectedBank=savedBank;renderBanks();const allBanks=[...BANK_DATA.primary,...BANK_DATA.g7,...BANK_DATA.g8,...BANK_DATA.g9,...BANK_DATA.exam];const bank=allBanks.find(b=>b.id===savedBank);if(bank){document.getElementById('curBank').style.display='block';document.getElementById('curBankName').textContent=bank.name+' ('+bank.count+')'}}</script></body></html>
