<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 教学网页（班级版原型）</title>
  <style>
    :root{--bg:#f1f5f9;--card:#ffffff;--line:#cbd5e1;--text:#0f172a;--muted:#475569;--ok:#16a34a;--bad:#dc2626;--pri:#2563eb;--warn:#f59e0b}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(120deg,#f8fafc,#e2e8f0);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1100px;margin:20px auto;padding:0 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
    h1,h2{margin:0 0 8px} .muted{color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,select,textarea{background:#ffffff;color:var(--text);border:1px solid #cbd5e1;border-radius:10px;padding:10px}
    input,select{height:40px}
    textarea{width:100%;min-height:120px}
    button{border:0;border-radius:10px;padding:10px 14px;color:#fff;font-weight:700;cursor:pointer}
    .pri{background:var(--pri)} .ok{background:var(--ok)} .warn{background:var(--warn);color:#111827} .ghost{background:#374151}
    .q{font-size:24px;line-height:1.4;margin:10px 0}
    .opts{display:grid;gap:8px}
    .opt{padding:10px;border:1px solid #cbd5e1;border-radius:10px;cursor:pointer;background:#f8fafc}
    .opt:hover{border-color:#2563eb}
    .fb{min-height:24px;font-weight:700;margin-top:6px}.good{color:#15803d}.bad{color:#b91c1c}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left;font-size:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
    .pill{padding:6px 10px;border:1px solid #cbd5e1;border-radius:999px;background:#ffffff;font-size:13px}
    .bar{width:220px;height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden;border:1px solid #cbd5e1}
    .bar>span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
    @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📘 Unit 1 教学网页（班级版原型）</h1>
    <div class="muted">支持：学生信息、单词闯关、成绩榜（本地保存）、题库导入（CSV/文本）</div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>1) 课堂设置</h2>
      <div class="row" style="margin-bottom:8px">
        <input id="className" placeholder="班级名（如：七1班）" style="width:180px" />
        <input id="studentName" placeholder="学生姓名" style="width:160px" />
        <select id="questionCount"><option>10</option><option selected>20</option><option>30</option></select>
        <select id="unitSelect">
          <option value="unit1" selected>题库：Unit 1</option><option value="unit2">题库：Unit 2</option><option value="unit3">题库：Unit 3</option><option value="unit4">题库：Unit 4</option>
          <option value="unit5">题库：Unit 5</option><option value="unit6">题库：Unit 6</option><option value="unit7">题库：Unit 7</option><option value="unit8">题库：Unit 8</option>
          <option value="unit9">题库：Unit 9</option><option value="unit10">题库：Unit 10</option><option value="unit11">题库：Unit 11</option><option value="unit12">题库：Unit 12</option>
          <option value="mix">题库：Unit1~12 混合</option>
        </select>
        <select id="difficulty"><option value="easy">简单</option><option value="normal" selected>标准</option><option value="hard">困难</option></select>
        <button class="pri" id="startBtn">开始闯关</button>
      </div>
      <div class="muted">建议：投屏时先录入班级和学生姓名，便于成绩榜统计。</div>
    </div>

    <div class="card">
      <h2>2) 生词学习（自然拼读）</h2>
      <div class="muted">先按题库学习单词，再开始闯关。支持拆分拼读 + 发音。</div>
      <div class="row" style="margin-bottom:8px">
        <select id="studyUnit">
          <option value="unit1" selected>学习题库：Unit 1</option><option value="unit2">学习题库：Unit 2</option><option value="unit3">学习题库：Unit 3</option><option value="unit4">学习题库：Unit 4</option>
          <option value="unit5">学习题库：Unit 5</option><option value="unit6">学习题库：Unit 6</option><option value="unit7">学习题库：Unit 7</option><option value="unit8">学习题库：Unit 8</option>
          <option value="unit9">学习题库：Unit 9</option><option value="unit10">学习题库：Unit 10</option><option value="unit11">学习题库：Unit 11</option><option value="unit12">学习题库：Unit 12</option>
          <option value="mix">学习题库：Unit1~12 混合</option>
        </select>
        <button class="ok" id="startStudyBtn">开始学习</button>
        <button class="ghost" id="prevStudyBtn">上一个</button>
        <button class="ghost" id="nextStudyBtn">下一个</button>
        <button class="pri" id="speakStudyBtn">🔊 拼读发音</button>
      </div>
      <div id="studyProgress" class="muted">学习进度：未开始</div>
      <div class="bar" style="width:100%;max-width:420px;margin-top:6px"><span id="studyProgressBar" style="width:0%"></span></div>
      <div id="studyWord" style="font-size:28px;font-weight:700;margin-top:6px">-</div>
      <div id="studyPhonics" class="muted" style="font-size:18px;margin-top:4px">拼读：-</div>
      <div id="studyCn" class="muted" style="margin-top:4px">中文：-</div>
      <div class="muted" id="bankStat" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card" id="gameCard">
    <h2>3) 闯关区</h2>
    <div class="hud">
      <span class="pill" id="stagePill">关卡 Lv.1</span>
      <span class="pill" id="comboPill">连击 x0</span>
      <span class="pill" id="timerPill">⏱️ 15s</span>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
    <div class="row muted" id="meta">第 0/0 题 · 得分 0 · 错题 0</div>
    <div id="question" class="q">请先点击“开始闯关”</div>
    <div id="options" class="opts"></div>
    <div id="spellWrap" class="row" style="display:none;margin-top:8px">
      <span>请输入英文：</span><input id="spellInput" style="min-width:280px" />
    </div>
    <div id="feedback" class="fb"></div>
    <div class="row" style="margin-top:10px">
      <button class="ok" id="submitBtn" disabled>提交</button>
      <button class="pri" id="nextBtn" disabled>下一题</button>
      <button class="ghost" id="speakBtn" disabled>🔊 读单词</button>
      <button class="warn" id="restartBtn" disabled>重开本轮</button>
      <button class="ghost" id="redoWrongBtn" disabled>错题重做</button>
      <button class="ghost" id="downloadWrongBtn" disabled>下载错词本</button>
    </div>
  </div>

  <div class="card">
    <h2>4) 成绩榜（本机 localStorage）</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="ghost" id="refreshRankBtn">刷新</button>
      <button class="warn" id="clearRankBtn">清空成绩榜</button>
    </div>
    <table>
      <thead><tr><th>时间</th><th>班级</th><th>学生</th><th>题库</th><th>得分</th><th>错题</th><th>题量</th></tr></thead>
      <tbody id="rankBody"></tbody>
    </table>
  </div>
</div>

<script>
const UNIT1_WORDS = [
  ["name","名字；名称"],["nice","令人愉快的；宜人的"],["to","用于动词原形前，构成不定式"],["meet","遇见；相逢"],["too","也；又；太"],
  ["your","你的；你们的"],["his","他的"],["her","她的"],["and","和；又；而"],["yes","是的"],["no","不；不是"],["not","不；没有"],
  ["zero","零"],["one","一"],["two","二"],["three","三"],["four","四"],["five","五"],["six","六"],["seven","七"],["eight","八"],["nine","九"],
  ["telephone","电话；电话机"],["number","号码；数字"],["phone","电话；电话机"],["first","第一；首先"],["last","最后的；末尾的"],["friend","朋友"]
];

const UNIT2_WORDS = [
  ["sister","姐妹"],["mother","母亲"],["father","父亲"],["parent","父(母)亲"],["brother","兄；弟"],
  ["grandmother","(外)祖母"],["grandfather","(外)祖父"],["grandparent","(外)祖父(母)"],["family","家庭"],["those","那些"],
  ["who","谁"],["these","这些"],["they","他(她、它)们"],["well","嗯；好吧"],["have","经受；经历"],
  ["day","一天；一日"],["bye","再见"],["son","儿子"],["cousin","堂(表)兄弟姐妹"],["photo","照片"],
  ["picture","图画；照片"],["here","这里"],["of","属于(某人或某物)；关于"],["next","下一个(的)"],["girl","女孩"]
];

const UNIT3_WORDS = [
  ["this","这；这个"],["that","那；那个"],["these","这些"],["those","那些"],["schoolbag","书包"],
  ["book","书"],["dictionary","词典"],["pen","钢笔"],["pencil","铅笔"],["eraser","橡皮"],
  ["ruler","尺；直尺"],["pencil box","文具盒"],["mine","我的（名词性物主代词）"],["hers","她的"],["yours","你的；你们的"],
  ["excuse","原谅；宽恕"],["me","我（宾格）"],["thank","感谢"],["teacher","老师"],["about","关于"],
  ["for","为了；给；对"],["welcome","受欢迎的"],["help","帮助"],["find","找到"],["ask","询问；请求"]
];

const UNIT4_WORDS = [
  ["where","在哪里"],["table","桌子"],["bed","床"],["bookcase","书架"],["sofa","沙发"],
  ["chair","椅子"],["on","在……上"],["under","在……下"],["come","来；来到"],["desk","书桌"],
  ["think","认为；想"],["room","房间"],["their","他(她、它)们的"],["hat","帽子"],["head","头"],
  ["yeah","是的；对"],["know","知道；了解"],["radio","收音机"],["clock","时钟"],["tape","磁带"],
  ["player","播放机"],["model","模型"],["plane","飞机"],["tidy","整洁的"],["everywhere","到处"],
  ["always","总是"],["our","我们的"],["in","在……里"],["box","箱；盒"],["English book","英语书"]
];

// 七年级下册 Unit 5~12（常见核心词）
const UNIT5_WORDS = [
  ["panda","熊猫"],["zoo","动物园"],["tiger","老虎"],["elephant","大象"],["koala","考拉"],
  ["lion","狮子"],["giraffe","长颈鹿"],["animal","动物"],["cute","可爱的"],["lazy","懒惰的"],
  ["smart","聪明的"],["beautiful","美丽的"],["kind of","有点儿"],["Australia","澳大利亚"],["South Africa","南非"],
  ["pet","宠物"],["leg","腿"],["sleep","睡觉"],["friendly","友好的"],["save","拯救"]
];

const UNIT6_WORDS = [
  ["newspaper","报纸"],["use","使用"],["soup","汤"],["wash","洗"],["movie","电影"],
  ["just","只是；恰好"],["house","房子"],["drink","喝"],["tea","茶"],["tomorrow","明天"],
  ["pool","游泳池"],["shop","商店"],["supermarket","超市"],["man","男人"],["race","竞赛"],
  ["study","学习"],["state","州"],["American","美国的"],["dragon","龙"],["wish","希望"]
];

const UNIT7_WORDS = [
  ["rain","下雨"],["windy","多风的"],["cloudy","多云的"],["sunny","晴朗的"],["snow","下雪"],
  ["weather","天气"],["cook","做饭"],["bad","坏的"],["park","公园"],["message","信息"],
  ["him","他（宾格）"],["could","能；可以"],["back","回来"],["problem","问题"],["again","再一次"],
  ["dry","干燥的"],["cold","冷的"],["hot","热的"],["warm","温暖的"],["visit","拜访"]
];

const UNIT8_WORDS = [
  ["post office","邮局"],["police station","警察局"],["hotel","旅馆"],["restaurant","餐馆"],["bank","银行"],
  ["hospital","医院"],["street","街道"],["pay","付费"],["near","在附近"],["across","在对面"],
  ["behind","在后面"],["town","镇；市镇"],["around","在周围"],["north","北；北方"],["along","沿着"],
  ["turn","转向"],["left","左边"],["right","右边"],["crossing","十字路口"],["spend","花费"]
];

const UNIT9_WORDS = [
  ["curly","卷曲的"],["straight","直的"],["tall","高的"],["medium","中等的"],["height","身高"],
  ["thin","瘦的"],["heavy","重的"],["build","体格"],["cinema","电影院"],["glasses","眼镜"],
  ["later","以后"],["handsome","英俊的"],["actor","演员"],["actress","女演员"],["person","人"],
  ["nose","鼻子"],["mouth","嘴"],["face","脸"],["round","圆形的"],["real","真正的"]
];

const UNIT10_WORDS = [
  ["noodle","面条"],["beef","牛肉"],["mutton","羊肉"],["cabbage","卷心菜"],["potato","土豆"],
  ["special","特色菜"],["would","愿意"],["yet","还；仍然"],["large","大号的"],["order","点菜"],
  ["size","尺寸"],["bowl","碗"],["tofu","豆腐"],["meat","肉"],["dumpling","饺子"],
  ["porridge","粥"],["onion","洋葱"],["fish","鱼"],["pancake","烙饼"],["world","世界"]
];

const UNIT11_WORDS = [
  ["milk","牛奶"],["cow","奶牛"],["horse","马"],["feed","喂养"],["farmer","农民"],
  ["quite","相当"],["anything","任何事物"],["grow","种植；生长"],["farm","农场"],["pick","采摘"],
  ["excellent","极好的"],["countryside","乡村"],["yesterday","昨天"],["flower","花"],["worry","担心"],
  ["luckily","幸运地"],["museum","博物馆"],["fire","火"],["painting","绘画"],["exciting","令人激动的"]
];

const UNIT12_WORDS = [
  ["camp","扎营"],["lake","湖"],["beach","海滩"],["sheep","羊"],["as","作为；像"],
  ["natural","自然的"],["butterfly","蝴蝶"],["visitor","游客"],["tired","疲倦的"],["stay","停留"],
  ["mouse","老鼠"],["baby","幼小的"],["language","语言"],["kite","风筝"],["moon","月亮"],
  ["surprise","惊奇"],["snake","蛇"],["jump","跳"],["forest","森林"],["ear","耳朵"]
];

const ALL_UNITS = {
  unit1: UNIT1_WORDS,
  unit2: UNIT2_WORDS,
  unit3: UNIT3_WORDS,
  unit4: UNIT4_WORDS,
  unit5: UNIT5_WORDS,
  unit6: UNIT6_WORDS,
  unit7: UNIT7_WORDS,
  unit8: UNIT8_WORDS,
  unit9: UNIT9_WORDS,
  unit10: UNIT10_WORDS,
  unit11: UNIT11_WORDS,
  unit12: UNIT12_WORDS,
};

const DEFAULT_WORDS = [...UNIT1_WORDS];
let WORDS = [...DEFAULT_WORDS];
let pool=[], idx=0, score=0, wrongItems=[], current=null, mode="", started=false;
let className="", studentName="", total=20;
let combo=0, bestCombo=0, stage=1;
let timer=15, timerId=null;
let difficulty='normal';
let selectedUnit='unit1';
let isRedoMode=false;
let studyList=[];
let studyIdx=0;

const $=id=>document.getElementById(id);
const meta=$("meta"), q=$("question"), opts=$("options"), fb=$("feedback"), spellWrap=$("spellWrap"), spellInput=$("spellInput");
const submitBtn=$("submitBtn"), nextBtn=$("nextBtn"), speakBtn=$("speakBtn"), restartBtn=$("restartBtn"), redoWrongBtn=$("redoWrongBtn"), downloadWrongBtn=$("downloadWrongBtn");
const studyUnit=$("studyUnit"), startStudyBtn=$("startStudyBtn"), prevStudyBtn=$("prevStudyBtn"), nextStudyBtn=$("nextStudyBtn"), speakStudyBtn=$("speakStudyBtn");
const studyProgress=$("studyProgress"), studyProgressBar=$("studyProgressBar"), studyWord=$("studyWord"), studyPhonics=$("studyPhonics"), studyCn=$("studyCn");
const stagePill=$("stagePill"), comboPill=$("comboPill"), timerPill=$("timerPill"), progressBar=$("progressBar");

function shuffle(a){return a.sort(()=>Math.random()-0.5)}
function pick(a,n){return shuffle([...a]).slice(0,n)}

function updateBankStat(){
  $("bankStat").textContent = `当前闯关题库词条：${WORDS.length}`;
}
updateBankStat();

function getStudyWords(unit){
  if(unit==='mix') return Object.values(ALL_UNITS).flat();
  return [...(ALL_UNITS[unit] || UNIT1_WORDS)];
}

function phonicsBreak(word){
  const w = String(word||'').toLowerCase().trim();
  if(!w) return '';
  // 简单自然拼读分段（启发式）
  const chunks = w
    .replace(/tion/g,'-tion')
    .replace(/sion/g,'-sion')
    .replace(/ing/g,'-ing')
    .replace(/th/g,'th-')
    .replace(/sh/g,'sh-')
    .replace(/ch/g,'ch-')
    .replace(/ph/g,'ph-')
    .replace(/ck/g,'-ck')
    .replace(/([aeiou]{2})/g,'-$1-')
    .replace(/([bcdfghjklmnpqrstvwxyz])([aeiou])/g,'$1-$2')
    .replace(/--+/g,'-')
    .replace(/^-|-$|\s+/g,'');
  return chunks;
}

function renderStudyCard(){
  if(!studyList.length){
    studyProgress.textContent = '学习进度：当前题库暂无词';
    studyProgressBar.style.width = '0%';
    studyWord.textContent = '-';
    studyPhonics.textContent = '拼读：-';
    studyCn.textContent = '中文：-';
    return;
  }
  const [en, cn] = studyList[studyIdx];
  const pct = Math.round(((studyIdx+1)/studyList.length)*100);
  studyProgress.textContent = `学习进度：${studyIdx+1}/${studyList.length} · ${(studyUnit.value||'unit1').toUpperCase()}`;
  studyProgressBar.style.width = `${pct}%`;
  studyWord.textContent = en;
  studyPhonics.textContent = `拼读：${phonicsBreak(en)}`;
  studyCn.textContent = `中文：${cn}`;
}

function speakStudyWord(){
  if(!studyList.length || !("speechSynthesis" in window)) return;
  const [en] = studyList[studyIdx];
  const u = new SpeechSynthesisUtterance(String(en||''));
  u.lang = 'en-US';
  u.rate = 0.82; // 慢速便于跟读
  u.pitch = 1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function startStudy(){
  studyList = getStudyWords(studyUnit.value || 'unit1');
  studyIdx = 0;
  renderStudyCard();
  speakStudyWord();
  startStudyBtn.textContent = '从第一个重学';
}

function prevStudy(){
  if(!studyList.length) return;
  studyIdx = (studyIdx - 1 + studyList.length) % studyList.length;
  renderStudyCard();
}

function nextStudy(){
  if(!studyList.length) return;
  if(studyIdx >= studyList.length - 1){
    // 学完后自动切到闯关（按当前学习题库）
    $("unitSelect").value = studyUnit.value;
    className = $("className").value.trim() || "未命名班级";
    studentName = $("studentName").value.trim() || "匿名学生";
    startGame();
    return;
  }
  studyIdx += 1;
  renderStudyCard();
  speakStudyWord();
}

renderStudyCard();

function applyUnitBank(){
  if(selectedUnit==='mix') WORDS = Object.values(ALL_UNITS).flat();
  else WORDS = [...(ALL_UNITS[selectedUnit] || UNIT1_WORDS)];
  updateBankStat();
}


function startGame(){
  className = $("className").value.trim() || "未命名班级";
  studentName = $("studentName").value.trim() || "匿名学生";
  total = Number($("questionCount").value || 20);
  difficulty = $("difficulty").value || 'normal';
  selectedUnit = $("unitSelect").value || 'unit1';
  applyUnitBank();
  pool = pick(WORDS, Math.min(total, WORDS.length));
  idx=0; score=0; wrongItems=[]; started=true;
  combo=0; bestCombo=0; stage=1;
  submitBtn.disabled=false; speakBtn.disabled=false; restartBtn.disabled=false; redoWrongBtn.disabled=false; downloadWrongBtn.disabled=false;
  showQ();
}

function showQ(){
  if(idx>=pool.length) return finish();
  current = pool[idx];
  mode = randomMode();
  stage = Math.min(5, Math.floor(idx/5)+1);
  const isBoss = idx === pool.length - 1; // 最后一题 Boss 关
  if(isBoss) mode = 'spell';
  fb.textContent=""; fb.className="fb"; nextBtn.disabled=true; submitBtn.disabled=false;
  spellInput.value=""; opts.innerHTML="";

  const [en,cn] = current;
  if(mode==="cn2en"){
    q.innerHTML = `【中译英（基础）】把中文选成英文：<br><b>${cn}</b>`;
    renderChoice(en, WORDS.filter(w=>w[0]!==en).map(w=>w[0]));
  }else if(mode==="en2cn"){
    q.innerHTML = `【英译中（基础）】选择英文词义：<br><b>${en}</b>`;
    renderChoice(cn, WORDS.filter(w=>w[1]!==cn).map(w=>w[1]));
  }else{
    q.innerHTML = `${isBoss ? '👑【Boss关·拼写题】' : '【拼写题（进阶）】'}请根据中文写出英文：<br><b>${cn}</b>`;
    spellWrap.style.display="flex"; opts.style.display="none"; spellInput.focus();
  }
  const baseTimer = difficulty==='easy' ? 20 : (difficulty==='hard' ? 12 : 15);
  const stagePenalty = mode==='spell' ? Math.max(0, stage-1) : 0;
  timer = Math.max(7, baseTimer - stagePenalty - (isBoss ? 2 : 0));
  startTimer();
  renderMeta();
  speakCurrentWord();
}

function renderChoice(correct,distr){
  spellWrap.style.display="none"; opts.style.display="grid";
  const optionsCount = difficulty==='easy' ? 3 : 4;
  const options = shuffle([correct,...pick(distr, optionsCount-1)]);
  options.forEach(t=>{
    const label=document.createElement("label"); label.className="opt";
    label.innerHTML=`<input type="radio" name="opt" value="${escapeHtml(t)}"> ${escapeHtml(t)}`;
    opts.appendChild(label);
  });
}

function randomMode(){
  const r=Math.random();
  if(difficulty==='easy') return r<0.45?"cn2en":r<0.9?"en2cn":"spell";      // 拼写少
  if(difficulty==='hard') return r<0.2?"cn2en":r<0.4?"en2cn":"spell";       // 拼写多
  return r<0.35?"cn2en":r<0.7?"en2cn":"spell";                               // 标准
}

function submit(){
  if(!started) return;
  stopTimer();
  const [en,cn] = current;
  let your="", correct="", right=false;
  if(mode==="spell"){
    your=spellInput.value.trim(); if(!your) return alert("请输入答案");
    correct=en; right=your.toLowerCase()===correct.toLowerCase();
  }else{
    const picked=document.querySelector('input[name="opt"]:checked'); if(!picked) return alert("请选择答案");
    your=picked.value; correct=(mode==="cn2en"?en:cn); right=(your===correct);
  }

  if(right){
    combo += 1;
    bestCombo = Math.max(bestCombo, combo);
    const isBoss = idx === pool.length - 1;
    const base=(mode==="spell"?12:4);  // 选择题低分、拼写题高分
    const diffBonus = difficulty==='hard' ? 3 : (difficulty==='easy' ? 0 : 1);
    const bonus=Math.min(14, Math.floor(combo*1.2)); // 连击加分更高
    const bossBonus = isBoss ? 8 : 0;
    const add=base+bonus+diffBonus+bossBonus;
    score+=add;
    fb.textContent=`✅ 正确 +${add}（连击 +${bonus}，难度 +${diffBonus}${bossBonus?`，Boss +${bossBonus}`:''}）`;
    fb.className="fb good";
    playSfx('ok');

    submitBtn.disabled=true;
    nextBtn.disabled=true;
    renderMeta();

    // 提交正确后自动下一题（Boss 关答对会进入结算）
    setTimeout(()=>{
      if(idx < pool.length){
        nextQ();
      }
    }, 450);
    return;
  }
  else {
    combo = 0;
    wrongItems.push({mode,en,cn,your,correct});
    fb.textContent=`❌ 正确答案：${correct}`;
    fb.className="fb bad";
    playSfx('bad');
  }

  submitBtn.disabled=true; nextBtn.disabled=false; renderMeta();
}

function nextQ(){ idx++; showQ(); }
function restartRound(){ if(!started) return; idx=0; score=0; wrongItems=[]; combo=0; bestCombo=0; stage=1; isRedoMode=false; pool=pick(WORDS, Math.min(total, WORDS.length)); showQ(); }

function redoWrong(){
  if(!wrongItems.length) return alert("当前没有错题可重做");
  const uniq = [];
  const seen = new Set();
  wrongItems.forEach(w=>{
    const k = `${w.en}|||${w.cn}`;
    if(!seen.has(k)){ seen.add(k); uniq.push([w.en, w.cn]); }
  });
  pool = uniq;
  idx = 0;
  combo = 0;
  bestCombo = 0;
  isRedoMode = true;
  fb.textContent = "🧠 已进入错题重做模式";
  fb.className = "fb";
  showQ();
}

function startTimer(){
  stopTimer();
  timerPill.textContent = `⏱️ ${timer}s`;
  timerId = setInterval(()=>{
    timer -= 1;
    timerPill.textContent = `⏱️ ${timer}s`;
    if(timer<=0){
      stopTimer();
      if(!submitBtn.disabled){
        combo = 0;
        wrongItems.push({mode, en: current?.[0]||"", cn: current?.[1]||"", your: "超时", correct: mode==="cn2en"?(current?.[0]||""):(mode==="en2cn"?(current?.[1]||""):(current?.[0]||""))});
        fb.textContent = "⏰ 超时，本题判错";
        fb.className = "fb bad";
        playSfx('bad');
        submitBtn.disabled = true;
        nextBtn.disabled = false;
        renderMeta();
      }
    }
  },1000);
}

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function speakCurrentWord(){

  if(!current || !("speechSynthesis" in window)) return;
  const [en] = current;
  const text = String(en || "").trim();
  if(!text) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.9;
  utter.pitch = 1.0;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function playSfx(type='ok'){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    if(type==='ok'){
      osc.frequency.setValueAtTime(660, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(880, ac.currentTime + 0.12);
    }else{
      osc.frequency.setValueAtTime(300, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ac.currentTime + 0.12);
    }
    gain.gain.setValueAtTime(0.0001, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, ac.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.16);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + 0.18);
  }catch(e){}
}

function renderMeta(){
  meta.textContent=`第 ${Math.min(idx+1,pool.length)}/${pool.length} 题 · 得分 ${score} · 错题 ${wrongItems.length} · ${className} / ${studentName} · ${selectedUnit.toUpperCase()} · 难度 ${difficulty}${isRedoMode?' · 错题重做':''}`;
  stagePill.textContent = `关卡 Lv.${stage}`;
  comboPill.textContent = `连击 x${combo}`;
  const pct = pool.length ? Math.round((idx / pool.length) * 100) : 0;
  progressBar.style.width = `${pct}%`;
}

function finish(){
  stopTimer();
  let level="💪 再练一轮会更稳";
  if(difficulty==='hard'){ if(score>=190) level="🏆 大师级"; else if(score>=145) level="🌟 高阶通过"; }
  else if(difficulty==='easy'){ if(score>=95) level="🏆 基础扎实"; else if(score>=70) level="🌟 入门通过"; }
  else { if(score>=150) level="🏆 词汇达人"; else if(score>=110) level="🌟 掌握不错"; }

  const medals = [];
  if(bestCombo>=8) medals.push('🔥 连击王');
  if(wrongItems.length<=2) medals.push('🛡️ 稳定输出');
  if(difficulty==='hard' && score>=145) medals.push('👑 困难征服者');
  if(isRedoMode && wrongItems.length===0) medals.push('🧠 纠错达人');

  q.innerHTML=`🎉 本轮完成<br><b>总分：${score}</b> · ${level}<br>🔥 最高连击：x${bestCombo}<br>${medals.length?('🏅 勋章：'+medals.join(' / ')):'🏅 勋章：继续挑战'}`;
  opts.innerHTML=""; spellWrap.style.display="none"; fb.textContent=`错题数：${wrongItems.length}`;
  submitBtn.disabled=true; nextBtn.disabled=true; speakBtn.disabled=true;
  progressBar.style.width = `100%`;
  playSfx('ok');
  saveRank(); renderRank();
}

function downloadWrong(){
  if(!wrongItems.length) return alert("当前没有错题可导出");
  const lines=[];
  lines.push(`班级：${className}  学生：${studentName}  时间：${new Date().toLocaleString()}`);
  lines.push("=".repeat(60));
  wrongItems.forEach((w,i)=>{ lines.push(`${i+1}. ${w.mode} | ${w.en} | ${w.cn}`); lines.push(`   你的答案: ${w.your}`); lines.push(`   正确答案: ${w.correct}`); lines.push(""); });
  const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`${className}_${studentName}_unit1_wrong_words.txt`; a.click(); URL.revokeObjectURL(a.href);
}

function saveRank(){
  const key="unit1_rank_v1";
  const old=JSON.parse(localStorage.getItem(key)||"[]");
  old.unshift({time:new Date().toLocaleString(), className, studentName, unit:selectedUnit, score, wrong:wrongItems.length, total:pool.length});
  localStorage.setItem(key, JSON.stringify(old.slice(0,200)));
}

function renderRank(){
  const body=$("rankBody"), key="unit1_rank_v1"; body.innerHTML="";
  const rows=JSON.parse(localStorage.getItem(key)||"[]");
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.time}</td><td>${escapeHtml(r.className)}</td><td>${escapeHtml(r.studentName)}</td><td>${escapeHtml((r.unit||'unit1').toUpperCase())}</td><td>${r.score}</td><td>${r.wrong}</td><td>${r.total}</td>`;
    body.appendChild(tr);
  });
}

function clearRank(){ if(confirm("确认清空成绩榜？")){ localStorage.removeItem("unit1_rank_v1"); renderRank(); } }

function resetBank(){ selectedUnit = $("unitSelect").value || 'unit1'; applyUnitBank(); alert(`已按当前选择加载词表：${selectedUnit.toUpperCase()}`); }
function escapeHtml(s){ return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$("startBtn").onclick=startGame;
submitBtn.onclick=submit;
nextBtn.onclick=nextQ;
speakBtn.onclick=speakCurrentWord;
restartBtn.onclick=restartRound;
redoWrongBtn.onclick=redoWrong;
downloadWrongBtn.onclick=downloadWrong;
startStudyBtn.onclick=startStudy;
prevStudyBtn.onclick=prevStudy;
nextStudyBtn.onclick=nextStudy;
speakStudyBtn.onclick=speakStudyWord;
studyUnit.onchange=()=>{ startStudy(); };
$("unitSelect").onchange=()=>{ studyUnit.value = $("unitSelect").value; };
$("refreshRankBtn").onclick=renderRank;
$("clearRankBtn").onclick=clearRank;
spellInput.addEventListener('keydown',e=>{if(e.key==='Enter') submit();});
renderRank();
startStudy();
</script>
</body>
</html>
